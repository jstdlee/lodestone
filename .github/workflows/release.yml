name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS M series, os: macos-latest, platform: darwin/arm64 }
          - { name: Windows x64, os: ubuntu-latest, platform: windows/amd64 }
          - { name: Linux x64, os: ubuntu-latest, platform: linux/amd64 }
          - { name: Linux ARM64, os: ubuntu-latest, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installer
        if: matrix.name == 'Windows x64'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Collect release files
        run: shopt -s nullglob; files=(build/*/*.dmg build/*/*-setup-*.exe build/*/*.deb build/*/*.tar.gz); if [ ${#files[@]} -eq 0 ]; then echo "no release files under build/" >&2; exit 1; fi; mkdir releases; cp "${files[@]}" releases/
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: releases/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Resolve the version
        id: tag
        run: |
          version=$(jq -r .version mygo.json)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag and push the version
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Lodestone ${tag#v}" "$GITHUB_SHA"
            git push origin "$tag"
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Lodestone ${TAG#v}" --generate-notes \
            artifacts/* 2>/dev/null \
          || gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*
